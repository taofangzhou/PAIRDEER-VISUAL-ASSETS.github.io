# Optional HTTP-only diagnostics BEFORE switching the production domain.
# Replace this file with nginx.conf when the HTTPS certificate is installed.
# Production admin cookies require HTTPS, so do not use this for admin login.
server {
    listen 80;
    server_name shuanglu-battery.cn 123.56.252.14;
    server_tokens off;
    client_max_body_size 52m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host shuanglu-battery.cn;
        proxy_set_header X-Forwarded-Host shuanglu-battery.cn;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header OAI-Authenticated-User-Id "";
        proxy_set_header OAI-Authenticated-User-Email "";
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
