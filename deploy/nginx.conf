# /etc/nginx/conf.d/pairdeer.conf
# Install the certificate/key at these paths before enabling this file.
server {
    listen 80;
    server_name shuanglu-battery.cn;
    return 301 https://shuanglu-battery.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name shuanglu-battery.cn;
    ssl_certificate /etc/nginx/ssl/shuanglu-battery.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/shuanglu-battery.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pairdeer_ssl:10m;
    server_tokens off;

    # Files are limited to 50 MiB by the app; multipart adds some overhead.
    client_max_body_size 52m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host shuanglu-battery.cn;
        proxy_set_header X-Forwarded-Host shuanglu-battery.cn;
        proxy_set_header X-Forwarded-Proto https;
        # Never forward client-supplied identity or IP headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header OAI-Authenticated-User-Id "";
        proxy_set_header OAI-Authenticated-User-Email "";
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
