<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#751d35" />
    <meta name="description" content="双鹿电池·网销视觉资料中心" />
    <link rel="canonical" href="https://shuanglu-battery.cn/" />
    <title>正在打开｜双鹿电池·网销视觉资料中心</title>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://shuanglu-battery.cn/" />
    </noscript>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #30262a; background: #faf7f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #f2e6e8 0, transparent 60%); }
      main { width: min(100%, 480px); padding: 48px 32px; border: 1px solid #eadfe1; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 20px 70px #5421370a; }
      .mark { display: flex; justify-content: center; gap: 6px; margin-bottom: 28px; }
      .mark span { width: 8px; height: 8px; border-radius: 50%; background: #751d35; animation: pulse 1.2s ease-in-out infinite; }
      .mark span:nth-child(2) { animation-delay: .15s; }
      .mark span:nth-child(3) { animation-delay: .3s; }
      .status { margin: 0 0 12px; color: #887b80; font-size: 14px; letter-spacing: .12em; }
      h1 { margin: 0; font-size: clamp(22px, 5vw, 28px); line-height: 1.5; font-weight: 650; letter-spacing: .02em; }
      h1 span { display: block; }
      .hint { margin: 24px 0 20px; color: #887b80; font-size: 13px; line-height: 1.7; }
      a { display: inline-block; min-width: 160px; padding: 13px 28px; border-radius: 12px; background: #751d35; color: #fff; font-size: 15px; font-weight: 600; text-decoration: none; transition: background .2s; }
      a:hover { background: #5c1529; }
      a:focus-visible { outline: 3px solid #c58a9a; outline-offset: 4px; }
      @keyframes pulse { 0%, 80%, 100% { opacity: .3; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .mark span { animation: none; } a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="status" role="status">正在打开</p>
      <h1><span>双鹿电池</span><span>网销视觉资料中心</span></h1>
      <p class="hint">若未自动跳转，请点击下方按钮。</p>
      <a id="entry" href="https://shuanglu-battery.cn/">立即进入</a>
    </main>
    <script>
      (() => {
        const destination = new URL("https://shuanglu-battery.cn/");
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        document.getElementById("entry").href = destination.href;
        window.location.replace(destination.href);
      })();
    </script>
  </body>
</html>
