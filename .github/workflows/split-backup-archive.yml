name: Publish resumable backup archive parts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/split-backup-archive.yml

permissions:
  contents: write

concurrency:
  group: split-existing-data-backup
  cancel-in-progress: false

jobs:
  publish_parts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKUP_TAG: data-backup-20261102T045044Z-41390483790
      PARTS_TAG: data-backup-20261102T045044Z-parts
      PARTS_RELEASE_ID: '431166826'
      ARCHIVE_NAME: pairdeer-complete-data-backup-20261102T045044Z.tar.gz
      ARCHIVE_SIZE: '575174060'
      ARCHIVE_SHA256: 44a07874a52db0a6d85d1d9b84318c3479c93b7d2b4b197610c8b04d790c514a
    steps:
      - name: Check out the splitter from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download only the already published backup archive and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup-source"
          gh release download "$BACKUP_TAG" \
            --pattern "$ARCHIVE_NAME" \
            --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/backup-source"

      - name: Verify the original archive before splitting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'backup-source'
          name = os.environ['ARCHIVE_NAME']
          archive = source / name
          expected = os.environ['ARCHIVE_SHA256']
          if archive.stat().st_size != int(os.environ['ARCHIVE_SIZE']):
              raise SystemExit('Original archive size mismatch')
          matching = []
          for line in (source / 'SHA256SUMS').read_text(encoding='utf-8').splitlines():
              fields = line.split(maxsplit=1)
              if len(fields) == 2 and fields[1].lstrip('*') == name:
                  matching.append(fields[0])
          if matching != [expected]:
              raise SystemExit('Original release checksum entry mismatch')
          digest = hashlib.sha256()
          with archive.open('rb') as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b''):
                  digest.update(block)
          if digest.hexdigest() != expected:
              raise SystemExit('Original archive SHA256 mismatch')
          print('Original 575174060-byte archive verified; no source Site was contacted.')
          PY

      - name: Split and verify recombination
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/split-backup-archive.py \
            "$RUNNER_TEMP/backup-source/$ARCHIVE_NAME" \
            --output-dir "$RUNNER_TEMP/backup-parts" \
            --expected-size "$ARCHIVE_SIZE" \
            --expected-sha256 "$ARCHIVE_SHA256"
          cp scripts/download-backup-parts.mjs "$RUNNER_TEMP/backup-parts/download-backup-parts.mjs"
          (
            cd "$RUNNER_TEMP/backup-parts"
            sha256sum download-backup-parts.mjs >> PARTS.SHA256SUMS
          )

      - name: Stage, verify and publish a separate immutable parts Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Original BACKUP_TAG assets are immutable and are never modified.
          # Prepare the exact local asset inventory before opening a new draft.
          python3 - <<'PY_ASSETS' > "$RUNNER_TEMP/backup-part-paths.txt"
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'backup-parts'
          manifest = json.loads((root / 'PARTS.json').read_text(encoding='utf-8'))
          expected_archive = {'name': os.environ['ARCHIVE_NAME'],
                              'size': int(os.environ['ARCHIVE_SIZE']),
                              'sha256': os.environ['ARCHIVE_SHA256']}
          if manifest.get('schemaVersion') != 1 or manifest.get('archive') != expected_archive:
              raise SystemExit('Split manifest does not match the original archive')
          if manifest.get('partSize') != 67108864 or len(manifest.get('parts', [])) != 9:
              raise SystemExit('Expected nine 64-MiB parts')
          names = []
          for index, part in enumerate(manifest['parts'], 1):
              if part['name'] != expected_archive['name'] + f'.part-{index:03d}':
                  raise SystemExit('Unexpected part name')
              if part['size'] != (67108864 if index < 9 else 38303148):
                  raise SystemExit('Unexpected part size')
              names.append(part['name'])
          names += ['PARTS.json', 'PARTS.SHA256SUMS', 'download-backup-parts.mjs']
          assets = {}
          for name in names:
              path = root / name
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(block)
              assets[name] = {'size': path.stat().st_size, 'sha256': digest.hexdigest()}
              print(path)
          expected = {'assets': assets, 'marker':
                      '<!-- pairdeer-backup-parts schema=1 source=' + os.environ['BACKUP_TAG'] +
                      ' sha256=' + os.environ['ARCHIVE_SHA256'] + ' -->'}
          (Path(os.environ['RUNNER_TEMP']) / 'expected-part-assets.json').write_text(
              json.dumps(expected), encoding='utf-8')
          PY_ASSETS
          cat > "$RUNNER_TEMP/verify-part-release.py" <<'PY_VERIFY'
          import json
          import os
          from pathlib import Path
          import sys
          root = Path(os.environ['RUNNER_TEMP'])
          expected = json.loads((root / 'expected-part-assets.json').read_text())
          release = json.loads((root / 'parts-release.json').read_text())
          mode = sys.argv[1]
          if release.get('tag_name') != os.environ['PARTS_TAG']:
              raise SystemExit('Wrong parts release tag')
          draft = release.get('draft')
          if not isinstance(draft, bool):
              raise SystemExit('Missing release draft status')
          if draft and expected['marker'] not in (release.get('body') or ''):
              raise SystemExit('Refusing to modify a draft not created by this backup publisher')
          assets = release.get('assets', [])
          names = [item['name'] for item in assets]
          if len(names) != len(set(names)) or not set(names).issubset(expected['assets']):
              raise SystemExit('Unexpected or duplicate assets in parts release')
          # A draft from an interrupted run may contain a subset. Only our own
          # draft can be resumed; an already-public release must match exactly.
          if mode != 'preflight' or not draft:
              if set(names) != set(expected['assets']):
                  raise SystemExit('Parts release does not contain all twelve expected assets')
              for asset in assets:
                  local = expected['assets'][asset['name']]
                  if asset.get('size') != local['size'] or asset.get('digest') != 'sha256:' + local['sha256']:
                      raise SystemExit('REST size/SHA256 mismatch: ' + asset['name'])
                  if asset.get('state') != 'uploaded':
                      raise SystemExit('Asset upload is not complete: ' + asset['name'])
          if mode == 'published' and draft:
              raise SystemExit('Parts release is still a draft')
          print('draft' if draft else 'published')
          PY_VERIFY
          marker=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/expected-part-assets.json"))["marker"])')
          cat > "$RUNNER_TEMP/parts-release-notes.md" <<NOTES
          $marker

          Nine verified parts of the existing complete product-data backup.
          Source archive Release: $BACKUP_TAG
          Original archive size: $ARCHIVE_SIZE bytes
          Original archive SHA256: $ARCHIVE_SHA256

          Includes PARTS.json, PARTS.SHA256SUMS and the HTTP/1.1 resumable download helper.
          All twelve asset sizes and SHA256 digests are verified through the GitHub REST API before publication.
          The original archive Release is unchanged. No new Site data was exported; ECS and DNS were unchanged.
          NOTES
          # This recovery job resumes the already-created, owner-verified draft.
          # Resolve neither tag visibility nor a quoted jq expression: use its
          # fixed REST ID, then verify tag/ownership/assets before any upload.
          release_id=$PARTS_RELEASE_ID
          [[ $release_id =~ ^[0-9]+$ ]] || { echo 'Invalid parts Release ID.' >&2; exit 1; }
          gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/parts-release.json"
          release_state=$(python3 "$RUNNER_TEMP/verify-part-release.py" preflight)
          if [[ $release_state == draft ]]; then
            mapfile -t backup_uploads < "$RUNNER_TEMP/backup-part-paths.txt"
            [[ ${#backup_uploads[@]} -eq 12 ]]
            # Clobber is restricted to these twelve names on our new DRAFT.
            gh release upload "$PARTS_TAG" "${backup_uploads[@]}" --clobber
          else
            echo 'Existing public parts Release matches all twelve local assets; leaving it unchanged.'
          fi
          verified=false
          for attempt in 1 2 3 4 5; do
            gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/parts-release.json"
            if python3 "$RUNNER_TEMP/verify-part-release.py" complete; then
              verified=true
              break
            fi
            sleep 3
          done
          [[ $verified == true ]] || { echo 'REST asset verification failed; parts Release will not be published.' >&2; exit 1; }
          if [[ $release_state == draft ]]; then
            # Publishing applies the repository's immutable-release policy.
            gh release edit "$PARTS_TAG" --draft=false
          fi
          gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/parts-release.json"
          python3 "$RUNNER_TEMP/verify-part-release.py" published
          {
            echo '## Backup download parts published and verified'
            echo
            echo "- Parts Release: $PARTS_TAG"
            echo "- Original archive Release: $BACKUP_TAG (unchanged)"
            echo '- Nine numbered parts: 001 through 009; all twelve assets passed REST SHA256 and size verification.'
            echo "- Original archive SHA256: $ARCHIVE_SHA256"
            echo '- No immutable Release assets were replaced or removed.'
            echo '- No new source data was exported; ECS, DNS and the old Site were unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
